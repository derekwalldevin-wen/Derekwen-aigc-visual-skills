core_prompt: |
  请基于我上传的照片，制作一张独立的3:4竖版「夜闪拖影双生」海报，画面上下严格1:1分割。

  上半：完整保留原始照片，仅轻微调色。

  下半：严格保持同一人物、同一张脸、同一服装、同一动作、同一场景和同一构图，将画面重构为真实的夜间直闪长曝光抓拍。人物面部和身体核心保持清晰锐利，使用强烈但真实的机顶闪光灯定格主体；背景、路人、车辆、街灯和环境高光沿同一个运动方向形成自然拖影、光轨和轻微残像。加入真实的低照度噪点、数码相机颗粒、闪光衰减、轻微曝光误差和夜间抓拍质感。最终像：主体被闪光灯定格的一瞬间，周围世界还在高速移动。禁止整张照片模糊、换脸、换动作、复制多个完整人物、乱方向拖影、霓虹特效和明显AI感。
