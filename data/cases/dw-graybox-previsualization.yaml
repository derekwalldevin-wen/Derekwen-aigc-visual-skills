tested_with: []
core_prompt: |
  以图1的灰盒预演为唯一镜头与动作参考，生成一段10秒、9:16的电影感视频；严格保留摄像机位置、焦段感与运动路径，人物和道具的位置、比例及朝向，每个动作发生的顺序与时间节点，前景/中景/后景的空间关系，以及遮挡、进出画和镜头停顿；将占位模型替换为完整角色、车辆、建筑和环境，角色身份参考图2、整体风格参考图3；先还原空间与镜头，再增加材质、光影、粒子和环境细节；禁止改变构图、重设计运镜、瞬移、交换动作顺序、擅加环绕镜头、重复角色或漂移物体。
controls:
  - "图1只负责空间、机位、镜头路径与动作时序，必须优先锁定"
  - "保持人物、车辆和道具的相对比例、位置与朝向"
  - "保持前景、中景、后景及遮挡、进出画关系"
  - "图2只负责角色身份，不得改变调度"
  - "图3只负责材质、光线与美术风格，不得重设计镜头"
  - "先验证空间与动作，再增加纹理、光效、粒子和环境细节"
extensions:
