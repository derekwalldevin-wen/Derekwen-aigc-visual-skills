tested_with: []
core_prompt: |
  上传图1、图2、图3、图4，生成一张独立的3:4竖版写实时尚摄影作品。
  图1：人物身份参考。只参考脸型、五官、发型、肤色、年龄与体型，最终人物必须保持图1的身份与辨识度。
  图2：服装造型参考。只参考服装版型、颜色、面料、纹理、配饰与穿搭层次，不继承图2人物身份和背景。
  图3：姿势与构图参考。只参考身体朝向、四肢位置、重心、视线、景别和人物在画面中的位置，不继承图3人物身份与服装。
  图4：场景与光线参考。只参考空间结构、环境材质、主光方向、色温、阴影与整体氛围，不复制图4中的原人物、文字或标志。
  最终结果必须是：图1的人物，穿着图2的服装，完成图3的姿势，真实站在图4的环境中。统一透视、光线方向、色温和接触阴影；服装贴合身体并具有真实褶皱与材质反射；脚部真实接触地面；手指完整；人物与背景之间没有拼贴边缘。
controls:
  - "四张参考图职责必须严格分离，不允许交叉继承"
  - "人物身份只来自图1"
  - "服装造型只来自图2"
  - "姿态与构图只来自图3"
  - "场景与光线只来自图4"
  - "统一透视、色温、光线方向与接触阴影"
  - "检查手脚完整、衣物褶皱和人物与环境的物理接触"
extensions:
