reconstructed_prompt: |
  参考【源图】中的【主体】，锁定其轮廓、姿态、比例、身份与关键细节；
  全部重构为中性灰哑光雕刻灰模，呈现连续实体、浮雕细节、
  柔和侧光与接触阴影，不是黑白滤镜。
  【输出模式】可以是单张灰模，或者3:4上彩色下灰模的双生海报。
  保持两半主体结构可对照，默认无多余文字。
prompt_evidence_note: "上述reconstructed_prompt根据今日12张已生成图片逆向整理；原始逐字图像Prompt及最终修改记录未能直接读取。不得将该提示词标注为用户实测原文。"
controls:
  - "中性灰哑光材质必须具有真实浮雕体积，避免仅做照片去饱和。"
  - "保留原主体的轮廓、比例、姿态及关键结构特征。"
  - "双生模式3:4，上半彩色参考，下半单色灰模，结构对照清楚。"
  - "主体与背景有可信柔和侧光、微阴影和接触关系。"
  - "有原始照片时先审查公开权限；无源图时彩色上半仅为AI合成示意。"
  - "不宣称能输出真正STL/OBJ等可用三维模型。"
