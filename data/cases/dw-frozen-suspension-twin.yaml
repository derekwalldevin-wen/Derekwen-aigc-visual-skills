tested_with: []
core_prompt: |
  基于用户上传的原始照片，制作一张独立的3:4竖版「凝时悬浮双生」海报，画面上下严格1:1硬分割。

  上半：完整保留原始照片，只做轻微统一调色，不改变人物、产品、场景、机位或动作。

  下半：严格保持同一主体、同一张脸、同一服装、同一动作、同一地点、同一机位和同一构图，只把画面中正在运动的元素冻结在最有张力的一瞬间。雨滴、水花、咖啡液、花瓣、粉末、冰块、发丝或衣摆可以悬停在空中，呈现真实高速摄影 / high-speed photography 的时间冻结效果。

  所有悬浮元素必须有明确来源、运动轨迹、重力关系、透视、遮挡和景深，保持真实摄影质感。禁止换脸、换衣、换动作、换场景、复制人物、随机生成无来源粒子、运动模糊、夸张魔法特效和明显AI感。
