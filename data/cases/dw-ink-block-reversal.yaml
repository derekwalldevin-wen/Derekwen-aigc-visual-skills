summary: "使用浓黑不规则墨块作为分界，让同一主体在墨块内呈白色刻线、墨块外呈黑色墨线，跨界但轮廓连续，形成高识别度的黑白反转版画。"
tested_with: []
core_prompt: |
  以【人物／宠物／骑行者／建筑／花卉／原创角色】作为画面主体，生成一张独立的3:4竖版黑白刮版／木刻版画风格作品。
  背景为自然米白纸张，保留真实纸纤维和轻微印刷颗粒。画面中加入一片浓黑、边缘不规则的墨块，墨块的位置和形状服务于【主体】的动作、构图与轮廓，不能只是简单贴在背后的矩形。
  主体必须自然跨过黑色墨块的边界：在墨块内部以清晰的白色刻线、白色留白表现主体的明暗和细节；在墨块外部，以细致的黑色墨线描绘同一主体。交界处的身体、毛发、衣褶、建筑结构或植物纹理需要连续，不能断裂或变成两个对象。
  使用真实版画的刀刻排线、擦痕、粗细线密度与纸墨质感，保持黑白两色为主；重点保证主体身份、动态姿势和视觉阅读顺序清楚。
  不要彩色、灰色照片滤镜、拼贴边缘、双主体复制、数字故障、塑料发光、无关装饰、Logo或水印。
controls:
  - "深黑墨块内用白色刻线，米白纸底上用黑色墨线，两侧必须真正反转。"
  - "主体跨越墨块边界，但轮廓、纹理、动作和透视保持连续。"
  - "墨块必须与构图发生关系，边缘自然粗粝，不用矩形贴片。"
  - "保留纸纤维、刀刻排线、墨色堆积的真实版画介质感。"
  - "GUIZANG图文版本另加克制宋体大标题与一句说明，文字避开脸、手、动作关键区域。"
