core_prompt: |
  以原涂鸦为唯一造型蓝图，
  保留轮廓、比例、部件数量与位置。
  歪斜和不对称也不修正。
  只增加真实材质、体积与自然光影，
  保持原来的观察方向。

  我不想改的三个点：
  【轮廓】/【比例】/【部件】
controls:
  - "以原涂鸦为唯一造型蓝图，不把写实变成重新设计造型。"
  - "先锁定三个不许改变的点：轮廓、比例、部件。"
  - "保留错误感与不对称：三条腿仍是三条腿，大小轮仍保留大小差异。"
  - "观察方向与关键位置保持对应，只增加真实材质、空间体积和自然光影。"
  - "教学图使用3:4单张竖版，原稿与立体结果可供对照；不要将六张图拼接成最终单图。"
