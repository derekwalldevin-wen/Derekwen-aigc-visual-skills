summary: "用户基于自己的原创角色探索方形循环聊天GIF。当天已找到480×480、16帧的“收到！”与“好玩！”成品，保持角色一致性、文字稳定、动作连贯与首尾循环是关键。"
core_prompt: |
  请基于【原创角色参考图】制作1:1循环GIF，内容【短语】。保持角色脸、头发、衣服和颜色一致，从【起始动作】到【夸张而自然的手势与表情】，最后恢复初态，首尾无缝循环。镜头、背景和字幕保持稳定，不闪屏；最终交付真实可播放GIF，不是静态图片或分镜拼贴。
core_prompt_provenance: "依据2026-11-05对话中的实际指令与已生成文件整理的通用可替换版本，非逐字回收的完整生图调用。"
tested_with: null
controls:
  - "原始角色源图和造型身份优先锁定，出现身份错误必须以最新用户参考重做。"
  - "GIF最终像素比例必须严格1:1；不能只在文案里写方形。"
  - "单句台词对应一个高识别度动作，停顿→表演→复位。"
  - "镜头、字幕、背景稳定；避免过快闪屏、角色跳变和突兀循环。"
  - "输出真实多帧GIF文件；九格草图、静态PNG不合格。"
  - "不公开第三方IP联动未核权图片，也不把用户明确拒绝的形象当最终成品。"
