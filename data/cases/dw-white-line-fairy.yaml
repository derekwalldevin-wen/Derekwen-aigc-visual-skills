core_prompt: |
  在真实摄影场景中加入一个由粗白线完整绘制的极简童话角色。角色内部不填色，保持透明，让真实背景能够从角色内部透出；只有白色轮廓线带非常轻微的柔光。

  角色必须与真实场景发生明确物理互动，例如坐在窗台、握住真实杯子、触碰真实萤火虫或把真实布艺星星放在枕边。接触点、遮挡关系、重量感、透视和环境光必须可信。

  画面保持真实摄影质感，色彩克制温暖，可加入少量与场景相关的微小光点或环境细节。禁止把角色做成白色贴纸、实心剪影、霓虹灯管、发光边框，也不要加入文字、Logo或额外装饰框。
controls:
  - "角色整体由粗白线绘制，内部不填色并保持透明"
  - "只有白色轮廓线允许轻微柔光，避免霓虹和贴纸感"
  - "角色必须与真实物体产生接触、遮挡和重量关系"
  - "真实场景保持摄影质感，角色不应破坏原有透视和光线"
  - "浮动细节保持少量且与场景相关，避免粒子堆砌"
  - "禁止文字、Logo、额外边框和实心白色区域"
