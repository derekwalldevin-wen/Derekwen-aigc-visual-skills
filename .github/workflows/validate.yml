name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data validation dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Validate Case data and generated indexes
        run: python scripts/validate_cases.py
      - name: Check generated index reproducibility
        run: |
          python scripts/build_case_data.py
          git diff --exit-code -- data/case-index.json data/stats.json data/latest.json
      - name: Validate regression checks
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate SKILL files and raster examples
        run: python scripts/validate_skills.py
